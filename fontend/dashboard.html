<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="dashboard.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Mobile Overlay -->
  <div id="mobile-overlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="ITS Logo" class="sidebar-logo-img">
      <button class="btn-collapse" onclick="toggleSidebar()"><i data-lucide="chevron-left"></i></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Tổng quan</div>
      <button class="nav-item active" onclick="loadView('dashboard')">
        <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
        <div class="tooltip">Dashboard</div>
      </button>

      <div class="nav-section-label">Nghiệp vụ</div>
      <button class="nav-item" onclick="loadView('quotation')">
        <i data-lucide="file-text"></i> <span>Báo giá</span>
        <div class="tooltip">Báo giá</div>
      </button>
      <button class="nav-item" onclick="loadView('orders')">
        <i data-lucide="shopping-cart"></i> <span>Đơn hàng</span>
        <div class="tooltip">Đơn hàng</div>
      </button>

      <div class="nav-section-label">Danh mục</div>
      <button class="nav-item" onclick="loadView('products')">
        <i data-lucide="package"></i> <span>Sản phẩm</span>
        <div class="tooltip">Sản phẩm</div>
      </button>
      <button class="nav-item" onclick="loadView('customers')">
        <i data-lucide="users"></i> <span>Khách hàng</span>
        <div class="tooltip">Khách hàng</div>
      </button>
      <button class="nav-item" onclick="loadView('companies')">
        <i data-lucide="building-2"></i> <span>Công ty</span>
        <div class="tooltip">Công ty</div>
      </button>

      <!-- Chỉ ADMIN mới thấy Quản lý Users -->
      <div class="nav-section-label" id="nav-users-label">Hệ thống</div>
      <button class="nav-item" id="nav-users-btn" onclick="loadView('users')">
        <i data-lucide="shield"></i> <span>Người dùng</span>
        <div class="tooltip">Người dùng</div>
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="mobile-toggle" onclick="toggleMobileMenu()"><i data-lucide="menu"></i></button>
        <div class="header-search">
          <i data-lucide="search"></i>
          <input type="text" placeholder="Tìm kiếm nhanh..." />
        </div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost" style="margin-right:8px;"><i data-lucide="arrow-left"></i> Xem trang
          web</a>
        <button class="btn-icon-header relative"><i data-lucide="bell"></i></button>
        <div class="header-user" onclick="toggleDropdown(event)">
          <div id="header-avatar" class="header-avatar">?</div>
          <div class="header-user-info">
            <div id="header-user-name" class="header-user-name">User</div>
            <div id="header-user-role" class="header-user-role">Role</div>
          </div>
          <div class="dropdown-menu" id="user-dropdown">
            <button class="dropdown-item" onclick="loadView('profile')"><i data-lucide="user"></i> Hồ sơ cá
              nhân</button>
            <button class="dropdown-item"><i data-lucide="settings"></i> Cài đặt hệ thống</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" onclick="logout()"><i data-lucide="log-out"></i> Đăng xuất</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content" id="main-content"></div>
  </main>

  <!-- Hidden Print Area (for actual browser printing) -->
  <style>
    @media screen {
      #print-area {
        display: none !important;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #print-area,
      #print-area * {
        visibility: visible;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
  <div id="print-area"></div>

  <!-- A4 Preview Modal (for on-screen viewing) -->
  <div id="preview-modal" class="modal-overlay" style="align-items: flex-start; overflow-y: auto; padding: 20px;"
    onclick="if(event.target === this) closePreview()">
    <div
      style="margin: 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; max-width: 210mm; width: 100%;">
      <!-- Sticky Action Bar -->
      <div
        style="position: sticky; top: 0; z-index: 2001; display: flex; gap: 12px; background: rgba(15,23,42,0.8); padding: 10px 20px; border-radius: 12px; backdrop-filter: blur(8px);">
        <button class="btn btn-primary" onclick="window.print()"><i data-lucide="printer"></i> In ngay</button>
        <button class="btn btn-ghost" onclick="closePreview()"
          style="background: rgba(255,255,255,0.1); color: white;"><i data-lucide="x"></i> Đóng</button>
      </div>

      <!-- A4 Paper -->
      <div
        style="background: white; width: 100%; min-height: 297mm; padding: 20mm; box-shadow: 0 0 50px rgba(0,0,0,0.5); color: black;"
        id="preview-content">
        <!-- Content injected by JS -->
      </div>
    </div>
  </div>

  <!-- CRUD Generic Modal -->
  <div id="crud-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="crud-title">Thêm mới</div>
        <button type="button" class="btn-icon-header" onclick="closeCrudModal()"><i data-lucide="x"></i></button>
      </div>
      <form id="crud-form" onsubmit="handleCrudSubmit(event)">
        <div class="modal-body" id="crud-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeCrudModal()">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary" id="crud-submit">
            <i data-lucide="save"></i> Lưu dữ liệu
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast System -->
  <div id="toast" class="toast">
    <i data-lucide="check-circle-2"></i>
    <span id="toast-msg"></span>
  </div>

  <!-- Confirm Modal -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card confirm-card">
      <div class="modal-body" style="text-align:center;">
        <div class="confirm-icon"><i data-lucide="alert-triangle" style="width:48px;height:48px;"></i></div>
        <h3 id="confirm-title" style="margin-bottom:8px; font-size:20px;">Xác nhận xóa?</h3>
        <p id="confirm-msg" style="color:var(--text-secondary); margin-bottom:24px;">Hành động này không thể hoàn tác.
        </p>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button type="button" class="btn btn-ghost" onclick="closeConfirm(false)">Hủy bỏ</button>
          <button type="button" class="btn btn-primary" id="confirm-ok-btn"
            style="background:var(--danger); border:none;">Xác nhận xóa</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CORE SYSTEM & AUTH
    // ==========================================
    const API = 'http://localhost:5000';
    const token = localStorage.getItem('crm_token');
    const user = JSON.parse(localStorage.getItem('crm_user') || 'null');

    if (!token || !user) window.location.href = 'login.html';
    else if (user.role === 'CUSTOMER') window.location.href = 'index.html';

    // RBAC UI
    document.getElementById('header-user-name').textContent = user.name;
    document.getElementById('header-user-role').textContent = user.role.toLowerCase();

    if (user.avatar) {
      document.getElementById('header-avatar').innerHTML = `<img src="${user.avatar}">`;
    } else {
      document.getElementById('header-avatar').textContent = user.name.charAt(0).toUpperCase();
    }

    if (user.role !== 'ADMIN') {
      document.getElementById('nav-users-label').style.display = 'none';
      document.getElementById('nav-users-btn').style.display = 'none';
    }

    // Initialize Sidebar State
    const sidebar = document.getElementById('sidebar');
    const savedCollapse = localStorage.getItem('sidebar_collapsed');
    if (savedCollapse === 'true') sidebar.classList.add('collapsed');

    window.toggleSidebar = () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
    };

    window.toggleMobileMenu = () => {
      sidebar.classList.toggle('mobile-open');
      document.getElementById('mobile-overlay').classList.toggle('active');
    };

    window.toggleDropdown = (e) => {
      e.stopPropagation();
      document.getElementById('user-dropdown').classList.toggle('show');
    };

    document.addEventListener('click', () => {
      const drop = document.getElementById('user-dropdown');
      if (drop && drop.classList.contains('show')) drop.classList.remove('show');
    });

    // Helper Functions
    // Improved Notification System
    const showToast = (msg, type = 'success') => {
      try {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        if (!toast || !toastMsg) { console.warn("Toast elements not found:", msg); return; }

        const toastIcon = toast.querySelector('i');
        toastMsg.textContent = msg;

        let iconName = 'check-circle-2';
        if (type === 'error') iconName = 'x-circle';
        if (type === 'info') iconName = 'info';

        if (toastIcon) {
          toastIcon.setAttribute('data-lucide', iconName);
          if (window.lucide) lucide.createIcons();
        }

        toast.className = `toast show ${type}`;

        if (window.toastTimer) clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toast.className = 'toast';
        }, 3000);
      } catch (e) { console.error("showToast error:", e); }
    };

    // Confirm Modal System
    let confirmCallback = null;
    const showConfirm = (title, msg, callback) => {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      document.getElementById('confirm-modal').classList.add('show');
      confirmCallback = callback;

      // Set button click
      const okBtn = document.getElementById('confirm-ok-btn');
      okBtn.onclick = () => {
        closeConfirm(true);
      };
      lucide.createIcons();
    };

    const closeConfirm = (result) => {
      document.getElementById('confirm-modal').classList.remove('show');
      if (result && confirmCallback) confirmCallback();
      confirmCallback = null;
    };

    const logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
    const formatMoney = (amount) => amount ? parseFloat(amount).toLocaleString('vi-VN') : '0';
    const parseMoney = (str) => str ? parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0 : 0;

    const fetchAPI = async (endpoint, options = {}) => {
      const res = await fetch(`${API}${endpoint}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) }
      });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) logout();
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Lỗi server');
      }
      return res.json();
    };

    // --- VALIDATION ENGINE ---
    const validateField = (id, value) => {
      try {
        const el = document.getElementById(id);
        if (!el) return true; // Skip if element not found (e.g. select without handled ID)

        const parent = el.closest('.form-group');
        const errorEl = parent ? parent.querySelector('.error-msg') : null;
        let error = '';

        if (id === 'm_email' || id === 'p_email') {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!value) error = 'Vui lòng nhập Email';
          else if (!emailRegex.test(value)) error = 'Email không hợp lệ';
        } else if (id === 'm_phone' || id === 'p_phone') {
          const phoneRegex = /^(0|\+84)[0-9]{9,10}$/;
          if (!value) error = 'Vui lòng nhập số điện thoại';
          else if (!phoneRegex.test(value.replace(/\s/g, ''))) error = 'Số điện thoại không hợp lệ (9-11 số)';
        } else if (['m_name', 'p_name', 'm_code', 'm_addr'].includes(id)) {
          if (!value || value.trim() === '') error = 'Vui lòng nhập thông tin này';
        } else if (id === 'm_pass' && !currentEditId) {
          if (!value || value.length < 6) error = 'Mật khẩu phải từ 6 ký tự';
        }

        if (error) {
          el.classList.add('error');
          if (errorEl) errorEl.textContent = error;
          return false;
        } else {
          el.classList.remove('error');
          if (errorEl) errorEl.textContent = '';
          return true;
        }
      } catch (e) {
        console.error("validateField error for ID " + id, e);
        return true; // Default to valid if check crashes to avoid blocking submit
      }
    };

    const normalizePhone = (phone) => {
      if (!phone) return '';
      let p = phone.replace(/\s/g, '');
      if (p.startsWith('0')) p = '+84' + p.substring(1);
      return p;
    };

    // State
    let currentModule = '';
    let currentData = [];
    let currentEditId = null;
    let quotes = JSON.parse(localStorage.getItem('crm_quotes')) || [];

    // ==========================================
    // ROUTING & VIEW ENGINE
    // ==========================================
    const updateNav = (view) => {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeBtn = document.querySelector(`[onclick="loadView('${view.split('_')[0]}')"]`);
      if (activeBtn) activeBtn.classList.add('active');
      if (window.innerWidth < 768) {
        sidebar.classList.remove('mobile-open');
        document.getElementById('mobile-overlay').classList.remove('active');
      }
    };

    const loadView = async (view, param = null) => {
      updateNav(view);
      currentModule = view;
      const content = document.getElementById('main-content');
      content.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top on view change

      if (view !== 'quotation_form') {
        content.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
             <div class="skeleton" style="width:200px; height:30px;"></div>
             <div class="skeleton" style="width:120px; height:36px;"></div>
          </div>
          <div class="card">
            <div style="padding:24px;"><div class="skeleton" style="height:200px"></div></div>
          </div>`;
      }

      try {
        if (view === 'dashboard') await renderDashboard(content);
        else if (view === 'orders') await renderModule(content, 'orders');
        else if (view === 'products') await renderModule(content, 'products');
        else if (view === 'users') await renderModule(content, 'users');
        else if (view === 'customers') await renderModule(content, 'customers');
        else if (view === 'companies') await renderModule(content, 'companies');
        else if (view === 'quotation') await renderQuotationList(content);
        else if (view === 'quotation_form') await renderQuotationForm(content, param);
        else if (view === 'profile') await renderProfile(content);
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="x-circle"></i></div><h3>Lỗi tải dữ liệu</h3><p class="text-secondary">${err.message}</p></div>`;
      }
      lucide.createIcons();
    };

    // ==========================================
    // GENERIC CRUD MODULE
    // ==========================================
    async function renderModule(container, module) {
      let data = [];
      if (module === 'customers') {
        const allUsers = await fetchAPI('/users');
        data = allUsers.filter(u => u.role === 'CUSTOMER');
      } else {
        data = await fetchAPI(`/${module}`);
      }
      currentData = data;

      const titles = { users: 'Người dùng', customers: 'Khách hàng', products: 'Sản phẩm', companies: 'Công ty', orders: 'Đơn hàng' };
      let thead = '';
      if (module === 'users' || module === 'customers') thead = `<tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'products') thead = `<tr><th style="width:60px">Ảnh</th><th>Mã SP</th><th>Tên sản phẩm</th><th>Đơn giá</th><th>Tồn kho</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'companies') thead = `<tr><th>Tên Công ty</th><th>Email</th><th>SĐT</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'orders') thead = `<tr><th>Mã Đơn</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày tạo</th><th style="text-align:right">Thao tác</th></tr>`;

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
           <div>
              <h1 style="font-size:24px; font-weight:600; margin-bottom:4px;">${titles[module]}</h1>
              <div style="color:var(--text-secondary); font-size:14px;">Quản lý dữ liệu hệ thống</div>
           </div>
           ${module !== 'orders' ? `<button type="button" class="btn btn-primary" onclick="openCrudModal()"><i data-lucide="plus"></i> Thêm mới</button>` : ''}
        </div>
        <div class="card table-card">
          <div class="table-header-row">
            <div class="table-title">Danh sách ${titles[module].toLowerCase()}</div>
            <div class="header-search" style="width:250px;">
              <i data-lucide="search"></i>
              <input type="text" placeholder="Tìm kiếm..." onkeyup="filterTable(this.value)">
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table id="data-table"><thead>${thead}</thead><tbody id="table-body"></tbody></table>
          </div>
        </div>
      `;
      renderTableBody();
    }

    function renderTableBody(highlightId = null) {
      const tbody = document.getElementById('table-body');
      if (!tbody) return;

      if (currentData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon"><i data-lucide="database"></i></div><h3>Chưa có dữ liệu</h3><p style="color:var(--text-secondary)">Bắt đầu bằng cách tạo bản ghi đầu tiên.</p></div></td></tr>`;
      } else {
        tbody.innerHTML = currentData.map(item => {
          const rowHtml = buildRow(currentModule, item);
          if (highlightId && item.id === highlightId) {
            return rowHtml.replace('<tr>', '<tr class="row-highlight">');
          }
          return rowHtml;
        }).join('');
      }
      lucide.createIcons();
    }

    function buildRow(module, item) {
      try {
        if (module === 'users' || module === 'customers') {
          const badge = `badge-${item.role.toLowerCase()}`;
          return `<tr>
            <td><div style="font-weight:600">${item.name}</div></td><td style="color:var(--text-secondary)">${item.email}</td>
            <td><span class="badge ${badge}"><i data-lucide="user"></i> ${item.role}</span></td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                <button type="button" class="btn-icon-header" onclick="openCrudModal(${item.id})"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                <button type="button" class="btn-icon-header" style="color:var(--danger)" onclick="deleteRecord(${item.id})"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
              </div>
            </td>
          </tr>`;
        }
        if (module === 'products') {
          const imgSrc = item.image || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZWVlIi8+PC9zdmc+';
          return `<tr>
            <td><img src="${imgSrc}" style="width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--border);" alt="Ảnh SP"></td>
            <td style="font-family:monospace; color:var(--text-secondary)">${item.product_code}</td><td><div style="font-weight:600">${item.name}</div></td>
            <td style="font-weight:600">${formatMoney(item.price)} đ</td><td>${item.stock}</td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                <button type="button" class="btn-icon-header" onclick="openCrudModal(${item.id})"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                <button type="button" class="btn-icon-header" style="color:var(--danger)" onclick="deleteRecord(${item.id})"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
              </div>
            </td>
          </tr>`;
        }
        if (module === 'companies') {
          return `<tr>
            <td><div style="font-weight:600">${item.name}</div></td><td style="color:var(--text-secondary)">${item.email || '-'}</td><td>${item.phone || '-'}</td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                <button type="button" class="btn-icon-header" onclick="openCrudModal(${item.id})"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                <button type="button" class="btn-icon-header" style="color:var(--danger)" onclick="deleteRecord(${item.id})"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
              </div>
            </td>
          </tr>`;
        }
        if (module === 'orders') {
          let badgeClass = 'badge-pending', icon = 'clock';
          if (item.status === 'completed') { badgeClass = 'badge-completed'; icon = 'check-circle-2'; }
          if (item.status === 'canceled') { badgeClass = 'badge-canceled'; icon = 'x-circle'; }
          return `<tr>
            <td style="font-family:monospace; font-weight:600;">${item.order_code}</td><td>${item.customer?.name || '-'}</td>
            <td style="font-weight:600">${formatMoney(item.total_price)} đ</td>
            <td><span class="badge ${badgeClass}"><i data-lucide="${icon}"></i> ${item.status}</span></td>
            <td style="color:var(--text-secondary)">${new Date(item.created_at).toLocaleDateString('vi-VN')}</td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                <button type="button" class="btn-icon-header" style="color:var(--success)" title="Hoàn thành" onclick="updateOrderStatus(${item.id}, 'completed')"><i data-lucide="check" style="width:16px;height:16px;"></i></button>

    window.handleCrudSubmit = async (e) => {
      e.preventDefault();

      // Full Validation before submit
      let isValid = true;
      let firstErrorField = null;
      const inputs = document.querySelectorAll('#crud-body input, #crud-body textarea');

      inputs.forEach(input => {
        if (!validateField(input.id, input.value)) {
          isValid = false;
          if (!firstErrorField) firstErrorField = input;
        }
      });

      if (!isValid) {
        if (firstErrorField) firstErrorField.focus();
        showToast('Vui lòng kiểm tra lại thông tin', 'error');
        return;
      }

      const btn = document.getElementById('crud-submit');
      const originalContent = btn.innerHTML;

      // Loading State
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Đang lưu...';
      lucide.createIcons();

      try {
        let payload = {};
        let endpoint = `/${currentModule === 'customers' ? 'users' : currentModule}`;
        let method = currentEditId ? 'PUT' : 'POST';
        if (currentEditId) endpoint += `/${currentEditId}`;

        if (currentModule === 'users' || currentModule === 'customers') {
          payload = { name: document.getElementById('m_name').value, role: document.getElementById('m_role').value };
          if (!currentEditId) {
            payload.email = document.getElementById('m_email').value;
            payload.password = document.getElementById('m_pass').value;
            endpoint = '/auth/register'; method = 'POST';
          }
        } else if (currentModule === 'products') {
          payload = {
            product_code: document.getElementById('m_code').value,
            name: document.getElementById('m_name').value,
            price: document.getElementById('m_price').value,
            stock: document.getElementById('m_stock').value,
            image: document.getElementById('m_image') ? document.getElementById('m_image').value : null
          };
        } else if (currentModule === 'companies') {
          payload = {
            name: document.getElementById('m_name').value,
            email: document.getElementById('m_email').value,
            phone: normalizePhone(document.getElementById('m_phone').value),
            address: document.getElementById('m_addr').value
          };
        }

        const data = await fetchAPI(endpoint, { method, body: JSON.stringify(payload) });

        // Success Feedback & Immediate UI Update
        if (currentEditId) {
          const index = currentData.findIndex(x => x.id === currentEditId);
          if (index !== -1) currentData[index] = data;
          showToast('Cập nhật thành công!');
        } else {
          if (!(currentModule === 'customers' && data.role !== 'CUSTOMER')) {
            currentData.unshift(data);
          }
          showToast('Thêm mới thành công!');
        }

        // Robust UI Update & Close
        renderTableBody(data ? data.id : null);
        closeCrudModal();

        if (!currentEditId) {
          document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
        }

      } catch (err) {
        console.error("Submit error:", err);
        showToast(err.message || 'Có lỗi xảy ra, vui lòng thử lại', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalContent;
        lucide.createIcons();
      }
    };

    window.handleExcelImport = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (jsonData.length < 2) return showToast('File Excel không có dữ liệu', 'error');

          // Mapping: STT | Tên sản phẩm | Nội dung | ĐVT | Số lượng | Đơn giá | Thành tiền
          const rows = jsonData.slice(1);
          const tbody = document.getElementById('items-body');
          tbody.innerHTML = '';

          let importCount = 0;
          rows.forEach(row => {
            if (!row[1]) return; // Skip if no product name
            const name = row[1] || '';
            const content = row[2] || '';
            const unit = row[3] || 'Cái';
            const qty = parseFloat(row[4]) || 1;
            const price = parseFloat(row[5]) || 0;
            addBlankRow(name, content, unit, qty, price);
            importCount++;
          });

          calcTotal();
          showToast(`Đã import ${importCount} sản phẩm thành công!`);
          e.target.value = ''; // Reset input
        } catch (err) {
          showToast('Lỗi đọc file Excel. Vui lòng kiểm tra định dạng.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    };

                <div style="text-align: left;">0903 159 101</div>
                
                <div style="text-align: right;">Email:</div>
                <div style="text-align: left; color: #000;">kd2@itslongan.com</div>
              </div>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;">STT</th>
                <th style="width: 70px; text-align: center;">HÌNH ẢNH</th>
                <th style="text-align: left;">CHI TIẾT SẢN PHẨM / NỘI DUNG CÔNG VIỆC</th>
                <th style="width: 50px; text-align: center;">ĐVT</th>
                <th style="width: 50px; text-align: center;">SL</th>
                <th style="width: 100px; text-align: right;">ĐƠN GIÁ</th>
                <th style="width: 110px; text-align: right;">THÀNH TIỀN</th>
              </tr>
            </thead>
            <tbody>
              ${itemsRows}
              <tr>
                <td colspan="6" style="text-align: right; font-size: 13px; font-weight: bold;">CỘNG TIỀN HÀNG</td>
                <td style="text-align: right; font-size: 14px; font-weight: bold;">${formatMoney(sum)}</td>
              </tr>
              <tr>
                <td colspan="6" style="text-align: right; font-size: 13px; font-weight: bold;">THUẾ SUẤT GTGT (8%)</td>
                <td style="text-align: right; font-size: 14px; font-weight: bold;">${formatMoney(vatAmount)}</td>
              </tr>
              <tr>
                <td colspan="6" style="text-align: right; font-size: 13px; font-weight: bold;">TỔNG CỘNG THANH TOÁN (VNĐ)</td>
                <td style="text-align: right; font-size: 15px; font-weight: bold;">${formatMoney(totalAmount)}</td>
              </tr>
            </tbody>
          </table>

          <div style="margin-bottom: 30px;">
            <h4 style="margin: 0 0 8px; font-size: 13px; border-bottom: 1px solid #000; padding-bottom: 3px; font-weight: bold;">ĐIỀU KHOẢN THƯƠNG MẠI:</h4>
            <p style="margin: 0; font-size: 12px; line-height: 1.5; white-space: pre-line;">${terms}</p>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px; text-align: center;">
            <div>
              <p style="margin: 0 0 100px; font-weight: bold; text-transform: uppercase; font-size: 13px;">ĐẠI DIỆN KHÁCH HÀNG</p>
              <p style="margin: 0; font-size: 11px;">(Ký và ghi rõ họ tên)</p>
            </div>
            <div>
              <p style="margin: 0 0 100px; font-weight: bold; text-transform: uppercase; font-size: 13px;">ĐẠI DIỆN CÔNG TY (ITS)</p>
              <p style="margin: 0; font-size: 11px;">(Ký và đóng dấu)</p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('print-area').innerHTML = htmlContent;
      document.getElementById('preview-content').innerHTML = htmlContent;
      document.getElementById('preview-modal').classList.add('show');
      lucide.createIcons();
    };

    window.closePreview = () => {
      document.getElementById('preview-modal').classList.remove('show');
    };

    // Dashboard Init
    async function renderDashboard(c) {
      const sum = await fetchAPI('/revenue/summary');
      c.innerHTML = `
        <div style="margin-bottom:24px;">
           <h1 style="font-size:24px; font-weight:600; margin-bottom:4px;">Tổng quan hệ thống</h1>
           <div style="color:var(--text-secondary); font-size:14px;">Theo dõi chỉ số kinh doanh</div>
        </div>
        <div class="stats-grid">
          <div class="card stat-card">
            <div class="stat-header">
               <div class="stat-icon"><i data-lucide="dollar-sign"></i></div>
               <span class="badge badge-completed"><i data-lucide="trending-up"></i> +12.5%</span>
            </div>
            <div style="margin-top:16px;">
               <div class="stat-title">Tổng doanh thu</div>
               <div class="stat-value">${formatMoney(sum.total_revenue)} đ</div>
            </div>
          </div>
          <div class="card stat-card">
            <div class="stat-header">
               <div class="stat-icon" style="background:rgba(16,185,129,0.1); color:#10b981"><i data-lucide="check-circle-2"></i></div>
            </div>
            <div style="margin-top:16px;">
               <div class="stat-title">Đơn hoàn thành</div>
               <div class="stat-value">${sum.completed_orders}</div>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // PROFILE MODULE
    // ==========================================
    async function renderProfile(container) {
      const profileData = await fetchAPI('/users/profile');

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
           <div>
              <h1 style="font-size:24px; font-weight:600; margin-bottom:4px;">Hồ sơ cá nhân</h1>
              <div style="color:var(--text-secondary); font-size:14px;">Quản lý thông tin tài khoản của bạn</div>
           </div>
           <button class="btn btn-ghost" style="color:var(--danger); border-color:rgba(239,68,68,0.2)" onclick="logout()">
             <i data-lucide="log-out"></i> Đăng xuất
           </button>
        </div>
        
        <div class="card" style="max-width: 600px; padding: 32px;">
          <form onsubmit="saveProfile(event)">
            <div style="display:flex; gap:24px; margin-bottom:32px; align-items:center;">
              <div style="position:relative; width:80px; height:80px; border-radius:50%; background:var(--accent); overflow:hidden; flex-shrink:0; cursor:pointer;" onclick="document.getElementById('p_avatar_file').click()">
                <img id="p_preview_avatar" src="${profileData.avatar || ''}" style="width:100%; height:100%; object-fit:cover; display:${profileData.avatar ? 'block' : 'none'}">
                <div id="p_preview_letter" style="width:100%; height:100%; display:${profileData.avatar ? 'none' : 'flex'}; align-items:center; justify-content:center; color:white; font-size:32px; font-weight:bold;">${profileData.name.charAt(0).toUpperCase()}</div>
                <div style="position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">
                   <i data-lucide="camera" style="color:white; width:24px; height:24px;"></i>
                </div>
              </div>
              <div style="flex:1;">
                <div class="form-group" style="margin-bottom:0;">
                  <label>Tải ảnh lên hoặc nhập URL</label>
                  <div style="display:flex; gap:12px;">
                    <input type="text" id="p_avatar_input" value="${profileData.avatar || ''}" placeholder="https://..." oninput="previewAvatar(this.value, '${profileData.name}')" style="flex:1">
                    <input type="file" id="p_avatar_file" accept="image/*" style="display:none" onchange="handleFileUpload(event, '${profileData.name}')">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('p_avatar_file').click()"><i data-lucide="upload"></i> Tải ảnh</button>
                    <button type="button" class="btn btn-ghost" style="color:var(--danger); border-color:rgba(239,68,68,0.2)" onclick="previewAvatar('', '${profileData.name}'); document.getElementById('p_avatar_input').value='';"><i data-lucide="trash-2"></i> Xóa</button>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <label>Họ và tên *</label>
              <input type="text" id="p_name" value="${profileData.name}" onblur="validateField('p_name', this.value)">
              <span class="error-msg"></span>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" value="${profileData.email}" disabled style="opacity:0.6; cursor:not-allowed;">
              <span class="error-msg"></span>
            </div>
            <div class="form-group">
              <label>Số điện thoại *</label>
              <input type="text" id="p_phone" value="${profileData.phone || ''}" onblur="validateField('p_phone', this.value)">
              <span class="error-msg"></span>
            </div>
            <div class="form-group">
              <label>Địa chỉ *</label>
              <input type="text" id="p_address" value="${profileData.address || ''}" onblur="validateField('p_address', this.value)">
              <span class="error-msg"></span>
            </div>
            
            <div style="margin-top:32px; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid var(--border); padding-top:24px;">
               <button type="button" class="btn btn-ghost" onclick="loadView('dashboard')">Hủy bỏ</button>
               <button type="submit" class="btn btn-primary" id="btn-save-profile"><i data-lucide="save"></i> Lưu cập nhật</button>
            </div>
          </form>
        </div>
      `;
    }

    window.previewAvatar = (url, name) => {
      const img = document.getElementById('p_preview_avatar');
      const letter = document.getElementById('p_preview_letter');
      if (url) {
        img.src = url; img.style.display = 'block'; letter.style.display = 'none';
      } else {
        img.style.display = 'none'; letter.style.display = 'flex'; letter.textContent = name.charAt(0).toUpperCase();
      }
    };

    window.handleFileUpload = (e, name) => {
      const file = e.target.files[0];
      if (!file) return;

      // Simple validation for size (max 2MB)
      if (file.size > 2 * 1024 * 1024) return showToast('Ảnh quá lớn, vui lòng chọn ảnh < 2MB', 'error');

      const reader = new FileReader();
      reader.onload = (ev) => {
        const base64 = ev.target.result;
        document.getElementById('p_avatar_input').value = base64;
        previewAvatar(base64, name);
      };
      reader.readAsDataURL(file);
    };

    window.saveProfile = async (e) => {
      e.preventDefault();

      // Validation
      let isValid = true;
      ['p_name', 'p_phone', 'p_address'].forEach(id => {
        if (!validateField(id, document.getElementById(id).value)) isValid = false;
      });

      if (!isValid) return showToast('Vui lòng kiểm tra lại thông tin', 'error');

      const btn = document.getElementById('btn-save-profile');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Đang lưu...';
      btn.disabled = true;
      lucide.createIcons();

      try {
        const payload = {
          name: document.getElementById('p_name').value,
          phone: normalizePhone(document.getElementById('p_phone').value),
          address: document.getElementById('p_address').value,
          avatar: document.getElementById('p_avatar_input').value
        };

        const updatedUser = await fetchAPI('/users/profile', { method: 'PUT', body: JSON.stringify(payload) });

        const sessionUser = JSON.parse(localStorage.getItem('crm_user'));
        const newUser = { ...sessionUser, ...updatedUser };
        localStorage.setItem('crm_user', JSON.stringify(newUser));

        document.getElementById('header-user-name').textContent = newUser.name;
        const ava = document.getElementById('header-avatar');
        if (newUser.avatar) {
          ava.innerHTML = `<img src="${newUser.avatar}">`;
        } else {
          ava.innerHTML = newUser.name.charAt(0).toUpperCase();
        }

        showToast('Cập nhật Profile thành công!');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
      }
    };

    loadView('dashboard');
  </script>
</body>

</html>
