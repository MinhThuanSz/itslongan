<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="dashboard.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Mobile Overlay -->
  <div id="mobile-overlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="index.html" title="Về trang chủ" style="display:flex; align-items:center; justify-content:center;">
        <img src="/logo.png" alt="ITS Logo" class="sidebar-logo-img">
      </a>
      <button class="btn-collapse" onclick="toggleSidebar()"><i data-lucide="chevron-left"></i></button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Tổng quan</div>
      <button class="nav-item active" onclick="loadView('dashboard')">
        <i data-lucide="layout-dashboard"></i> <span>Dashboard</span>
        <div class="tooltip">Dashboard</div>
      </button>

      <div class="nav-section-label">Nghiệp vụ</div>
      <button class="nav-item" onclick="loadView('quotation')">
        <i data-lucide="file-text"></i> <span>Báo giá</span>
        <div class="tooltip">Báo giá</div>
      </button>
      <button class="nav-item" onclick="loadView('orders')">
        <i data-lucide="shopping-cart"></i> <span>Đơn hàng</span>
        <div class="tooltip">Đơn hàng</div>
      </button>

      <div class="nav-section-label">Danh mục</div>
      <button class="nav-item" onclick="loadView('products')">
        <i data-lucide="package"></i> <span>Sản phẩm</span>
        <div class="tooltip">Sản phẩm</div>
      </button>
      <button class="nav-item" onclick="loadView('customers')">
        <i data-lucide="users"></i> <span>Khách hàng</span>
        <div class="tooltip">Khách hàng</div>
      </button>
      <button class="nav-item" onclick="loadView('companies')">
        <i data-lucide="building-2"></i> <span>Công ty</span>
        <div class="tooltip">Công ty</div>
      </button>

      <!-- Chỉ ADMIN mới thấy Quản lý Users -->
      <div class="nav-section-label" id="nav-users-label">Hệ thống</div>
      <button class="nav-item" id="nav-users-btn" onclick="loadView('users')">
        <i data-lucide="shield"></i> <span>Người dùng</span>
        <div class="tooltip">Người dùng</div>
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="mobile-toggle" onclick="toggleMobileMenu()"><i data-lucide="menu"></i></button>
        <div class="search-overlay" id="global-search-overlay"></div>
        <div class="header-search" id="global-search-container">
          <i data-lucide="search"></i>
          <input type="text" id="global-search-input" placeholder="Tìm kiếm nhanh (Ctrl + K)..." autocomplete="off" />
          <div class="search-dropdown" id="global-search-dropdown"></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon-header relative"><i data-lucide="bell"></i></button>
        <div class="header-user" onclick="toggleDropdown(event)">
          <div id="header-avatar" class="header-avatar">?</div>
          <div class="header-user-info">
            <div id="header-user-name" class="header-user-name">User</div>
            <div id="header-user-role" class="header-user-role">Role</div>
          </div>
          <div class="dropdown-menu" id="user-dropdown">
            <button class="dropdown-item" onclick="loadView('profile')"><i data-lucide="user"></i> Hồ sơ cá
              nhân</button>
            <button class="dropdown-item"><i data-lucide="settings"></i> Cài đặt hệ thống</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" onclick="logout()"><i data-lucide="log-out"></i> Đăng xuất</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content" id="main-content"></div>
  </main>

  <!-- Hidden Print Area (for actual browser printing) -->
  <style>
    .custom-role-option:hover { background: #f1f5f9; }
    .custom-role-option.disabled:hover { background: transparent; }
    @media screen {
      #print-area {
        display: none !important;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #print-area,
      #print-area * {
        visibility: visible;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
  <div id="print-area"></div>

  <!-- A4 Preview Modal (for on-screen viewing) -->
  <div id="preview-modal" class="modal-overlay" style="align-items: flex-start; overflow-y: auto; padding: 20px;"
    onclick="if(event.target === this) closePreview()">
    <div
      style="margin: 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; max-width: 210mm; width: 100%;">
      <!-- Sticky Action Bar -->
      <div
        style="position: sticky; top: 0; z-index: 2001; display: flex; gap: 12px; background: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <button class="btn btn-primary" onclick="window.print()"><i data-lucide="printer"></i> In ngay</button>
        <button class="btn btn-ghost" onclick="closePreview()"
          style="background: #f1f5f9; color: var(--text-primary);"><i data-lucide="x"></i> Đóng</button>
      </div>

      <!-- A4 Paper -->
      <div
        style="background: white; width: 100%; min-height: 297mm; padding: 20mm; box-shadow: 0 0 50px rgba(0,0,0,0.5); color: black;"
        id="preview-content">
        <!-- Content injected by JS -->
      </div>
    </div>
  </div>

  <!-- CRUD Generic Modal -->
  <div id="crud-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="crud-title">Thêm mới</div>
        <button type="button" class="btn-icon-header" onclick="closeCrudModal()"><i data-lucide="x"></i></button>
      </div>
      <form id="crud-form" onsubmit="handleCrudSubmit(event)">
        <div class="modal-body" id="crud-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeCrudModal()">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary" id="crud-submit">
            <i data-lucide="save"></i> Lưu dữ liệu
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast System -->
  <div id="toast" class="toast">
    <i data-lucide="check-circle-2"></i>
    <span id="toast-msg"></span>
  </div>

  <!-- Confirm Modal -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card confirm-card">
      <div class="modal-body" style="text-align:center;">
        <div class="confirm-icon"><i data-lucide="alert-triangle" style="width:48px;height:48px;"></i></div>
        <h3 id="confirm-title" style="margin-bottom:8px; font-size:20px;">Xác nhận xóa?</h3>
        <p id="confirm-msg" style="color:var(--text-secondary); margin-bottom:24px;">Hành động này không thể hoàn tác.
        </p>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button type="button" class="btn btn-ghost" onclick="closeConfirm(false)">Hủy bỏ</button>
          <button type="button" class="btn btn-primary" id="confirm-ok-btn"
            style="background:var(--danger); border:none;">Xác nhận xóa</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CORE SYSTEM & AUTH
    // ==========================================
    const API = 'http://localhost:5000';
    const token = localStorage.getItem('crm_token');
    const user = JSON.parse(localStorage.getItem('crm_user') || 'null');

    if (!token || !user) window.location.href = 'login.html';
    else if (user.role === 'CUSTOMER') window.location.href = 'index.html';

    // RBAC UI
    document.getElementById('header-user-name').textContent = user.name;
    if (user.role === 'ADMIN') {
      document.getElementById('header-user-role').innerHTML = '<span style="background:var(--primary); color:white; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; letter-spacing:0.5px;">ADMIN</span>';
    } else {
      document.getElementById('header-user-role').innerHTML = '<span style="background:#e0e7ff; color:#4f46e5; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; letter-spacing:0.5px;">STAFF (Read-only)</span>';
    }

    if (user.avatar) {
      document.getElementById('header-avatar').innerHTML = `<img src="${user.avatar}">`;
    } else {
      document.getElementById('header-avatar').textContent = user.name.charAt(0).toUpperCase();
    }

    if (user.role !== 'ADMIN') {
      document.getElementById('nav-users-label').style.display = 'none';
      document.getElementById('nav-users-btn').style.display = 'none';
    }

    // Initialize Sidebar State
    const sidebar = document.getElementById('sidebar');
    const savedCollapse = localStorage.getItem('sidebar_collapsed');
    if (savedCollapse === 'true') sidebar.classList.add('collapsed');

    window.toggleSidebar = () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
    };

    window.toggleMobileMenu = () => {
      sidebar.classList.toggle('mobile-open');
      document.getElementById('mobile-overlay').classList.toggle('active');
    };

    window.toggleDropdown = (e) => {
      e.stopPropagation();
      document.getElementById('user-dropdown').classList.toggle('show');
    };

    document.addEventListener('click', () => {
      const drop = document.getElementById('user-dropdown');
      if (drop && drop.classList.contains('show')) drop.classList.remove('show');
    });

    // Helper Functions
    // Improved Notification System
    const showToast = (msg, type = 'success') => {
      try {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        if (!toast || !toastMsg) { console.warn("Toast elements not found:", msg); return; }

        const toastIcon = toast.querySelector('i');
        toastMsg.textContent = msg;

        let iconName = 'check-circle-2';
        if (type === 'error') iconName = 'x-circle';
        if (type === 'info') iconName = 'info';

        if (toastIcon) {
          toastIcon.setAttribute('data-lucide', iconName);
          if (window.lucide) lucide.createIcons();
        }

        toast.className = `toast show ${type}`;

        if (window.toastTimer) clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toast.className = 'toast';
        }, 3000);
      } catch (e) { console.error("showToast error:", e); }
    };

    // Confirm Modal System
    let confirmCallback = null;
    const showConfirm = (title, msg, callback) => {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      document.getElementById('confirm-modal').classList.add('show');
      confirmCallback = callback;

      // Set button click
      const okBtn = document.getElementById('confirm-ok-btn');
      okBtn.onclick = () => {
        closeConfirm(true);
      };
      lucide.createIcons();
    };

    const closeConfirm = (result) => {
      document.getElementById('confirm-modal').classList.remove('show');
      if (result && confirmCallback) confirmCallback();
      confirmCallback = null;
    };

    const logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
    const formatMoney = (amount) => amount ? parseFloat(amount).toLocaleString('vi-VN') : '0';
    const parseMoney = (str) => str ? parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0 : 0;

    const fetchAPI = async (endpoint, options = {}) => {
      const res = await fetch(`${API}${endpoint}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) }
      });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
           const err = await res.json().catch(() => ({}));
           if (res.status === 403) throw new Error(err.message || 'Bạn không có quyền thực hiện hành động này');
           logout();
        }
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Lỗi server');
      }
      return res.json();
    };

    // --- VALIDATION ENGINE ---
    const validateField = (id, value) => {
      try {
        const el = document.getElementById(id);
        if (!el) return true; // Skip if element not found (e.g. select without handled ID)

        const parent = el.closest('.form-group');
        const errorEl = parent ? parent.querySelector('.error-msg') : null;
        let error = '';

        if (id === 'm_email' || id === 'p_email') {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!value) error = 'Vui lòng nhập Email';
          else if (!emailRegex.test(value)) error = 'Email không hợp lệ';
        } else if (id === 'm_phone' || id === 'p_phone') {
          const phoneRegex = /^(0|\+84)[0-9]{9,10}$/;
          if (!value) error = 'Vui lòng nhập số điện thoại';
          else if (!phoneRegex.test(value.replace(/\s/g, ''))) error = 'Số điện thoại không hợp lệ (9-11 số)';
        } else if (['m_name', 'p_name', 'm_code', 'm_addr'].includes(id)) {
          if (!value || value.trim() === '') error = 'Vui lòng nhập thông tin này';
        } else if (id === 'm_pass' && !currentEditId) {
          if (!value || value.length < 6) error = 'Mật khẩu phải từ 6 ký tự';
        }

        if (error) {
          el.classList.add('error');
          if (errorEl) errorEl.textContent = error;
          return false;
        } else {
          el.classList.remove('error');
          if (errorEl) errorEl.textContent = '';
          return true;
        }
      } catch (e) {
        console.error("validateField error for ID " + id, e);
        return true; // Default to valid if check crashes to avoid blocking submit
      }
    };

    const normalizePhone = (phone) => {
      if (!phone) return '';
      let p = phone.replace(/\s/g, '');
      if (p.startsWith('0')) p = '+84' + p.substring(1);
      return p;
    };

    // State
    let currentModule = '';
    let currentData = [];
    let currentEditId = null;
    let quotes = JSON.parse(localStorage.getItem('crm_quotes')) || [];

    // ==========================================
    // ROUTING & VIEW ENGINE
    // ==========================================
    const updateNav = (view) => {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeBtn = document.querySelector(`[onclick="loadView('${view.split('_')[0]}')"]`);
      if (activeBtn) activeBtn.classList.add('active');
      if (window.innerWidth < 768) {
        sidebar.classList.remove('mobile-open');
        document.getElementById('mobile-overlay').classList.remove('active');
      }
    };

    const loadView = async (view, param = null, isPopState = false) => {
      updateNav(view);
      currentModule = view;
      if (!isPopState) {
        let url = view === 'dashboard' ? '/dashboard' : `/${view}`;
        if (param) url += `?id=${param}`;
        window.history.pushState({ view, param }, "", url);
      }
      const content = document.getElementById('main-content');
      content.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top on view change

      if (view !== 'quotation_form') {
        content.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
             <div class="skeleton" style="width:200px; height:30px;"></div>
             <div class="skeleton" style="width:120px; height:36px;"></div>
          </div>
          <div class="card">
            <div style="padding:24px;"><div class="skeleton" style="height:200px"></div></div>
          </div>`;
      }

      try {
        if (view === 'dashboard') await renderDashboard(content);
        else if (view === 'orders') await renderModule(content, 'orders');
        else if (view === 'products') await renderModule(content, 'products');
        else if (view === 'users') await renderModule(content, 'users');
        else if (view === 'customers') await renderModule(content, 'customers');
        else if (view === 'companies') await renderModule(content, 'companies');
        else if (view === 'quotation') await renderQuotationList(content);
        else if (view === 'quotation_form') await renderQuotationForm(content, param);
        else if (view === 'profile') await renderProfile(content);
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="x-circle"></i></div><h3>Lỗi tải dữ liệu</h3><p class="text-secondary">${err.message}</p></div>`;
      }
      lucide.createIcons();
    };

    // ==========================================
    // GENERIC CRUD MODULE
    // ==========================================
    async function renderModule(container, module) {
      let data = [];
      if (module === 'customers') {
        const allUsers = await fetchAPI('/users');
        data = allUsers.filter(u => u.role === 'CUSTOMER');
      } else {
        data = await fetchAPI(`/${module}`);
        if (module === 'users') {
          data = data.filter(u => u.role !== 'CUSTOMER');
        }
      }
      currentData = data;

      const titles = { users: 'Người dùng', customers: 'Khách hàng', products: 'Sản phẩm', companies: 'Công ty', orders: 'Đơn hàng' };
      let thead = '';
      if (module === 'users' || module === 'customers') thead = `<tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'products') thead = `<tr><th style="width:60px">Ảnh</th><th>Mã SP</th><th>Tên sản phẩm</th><th>Đơn giá</th><th>Tồn kho</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'companies') thead = `<tr><th>Tên Công ty</th><th>Email</th><th>SĐT</th><th style="text-align:right">Thao tác</th></tr>`;
      else if (module === 'orders') thead = `<tr><th>Mã Đơn</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Cập nhật</th><th style="text-align:right">Thao tác</th></tr>`;

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
           <div>
              <h1 style="font-size:24px; font-weight:600; margin-bottom:4px;">${titles[module]}</h1>
              <div style="color:var(--text-secondary); font-size:14px;">Quản lý dữ liệu hệ thống</div>
           </div>
           ${module !== 'orders' ? (user.role === 'STAFF' 
              ? `<button type="button" class="btn btn-primary" style="opacity:0.6; cursor:not-allowed;" onclick="showToast('Bạn chỉ có quyền xem', 'error')"><i data-lucide="plus"></i> Thêm mới</button>`
              : `<button type="button" class="btn btn-primary" onclick="openCrudModal()"><i data-lucide="plus"></i> Thêm mới</button>`) : ''}
        </div>
        <div class="card table-card">
          <div class="table-header-row">
            <div class="table-title">Danh sách ${titles[module].toLowerCase()}</div>
            <div class="header-search" style="width:250px;">
              <i data-lucide="search"></i>
              <input type="text" placeholder="Tìm kiếm..." onkeyup="filterTable(this.value)">
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table id="data-table"><thead>${thead}</thead><tbody id="table-body"></tbody></table>
          </div>
        </div>
      `;
      renderTableBody();
    }

    function renderTableBody(highlightId = null) {
      const tbody = document.getElementById('table-body');
      if (!tbody) return;

      if (currentData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon"><i data-lucide="database"></i></div><h3>Chưa có dữ liệu</h3><p style="color:var(--text-secondary)">Bắt đầu bằng cách tạo bản ghi đầu tiên.</p></div></td></tr>`;
      } else {
        tbody.innerHTML = currentData.map(item => {
          const rowHtml = buildRow(currentModule, item);
          if (highlightId && item.id === highlightId) {
            return rowHtml.replace('<tr>', '<tr class="row-highlight">');
          }
          return rowHtml;
        }).join('');
      }
      lucide.createIcons();
    }

    function buildRow(module, item) {
      try {
        if (module === 'users' || module === 'customers') {
          const badge = `badge-${item.role.toLowerCase()}`;
          return `<tr>
            <td><div style="font-weight:600">${item.name}</div></td><td style="color:var(--text-secondary)">${item.email}</td>
            <td><span class="badge ${badge}"><i data-lucide="user"></i> ${item.role}</span></td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                <button type="button" class="btn-icon-header" onclick="openCrudModal(${item.id})"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                <button type="button" class="btn-icon-header" style="color:var(--danger)" onclick="deleteRecord(${item.id})"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
              </div>
            </td>
          </tr>`;
        }
        if (module === 'products') {
          const imgSrc = item.image || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZWVlIi8+PC9zdmc+';
          return `<tr>
            <td><img src="${imgSrc}" style="width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--border);" alt="Ảnh SP"></td>
            <td style="font-family:monospace; color:var(--text-secondary)">${item.product_code}</td><td><div style="font-weight:600">${item.name}</div></td>
            <td style="font-weight:600">${formatMoney(item.price)} đ</td><td>${item.stock}</td>
            <td>
              <div style="display: flex; gap: 4px; justify-content: flex-end;">
                ${user.role === 'STAFF'
                  ? `<button type="button" class="btn-icon-header" style="opacity:0.5; cursor:not-allowed;" title="Bạn chỉ có quyền xem" onclick="showToast('Bạn chỉ có quyền xem', 'error')"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                     <button type="button" class="btn-icon-header" style="color:var(--danger); opacity:0.5; cursor:not-allowed;" title="Bạn chỉ có quyền xem" onclick="showToast('Bạn chỉ có quyền xem', 'error')"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>`

    window.closeCrudModal = () => {
      document.getElementById('crud-modal').classList.remove('show');

      document.querySelectorAll('#crud-body .error-msg').forEach(el => el.textContent = '');
      document.querySelectorAll('#crud-body .error').forEach(el => el.classList.remove('error'));
    };

    window.handleCrudSubmit = async (e) => {
      e.preventDefault();
      
      if (user.role === 'STAFF') { return showToast('Bạn chỉ có quyền xem', 'error'); }

      // Full Validation before submit
      let isValid = true;
      let firstErrorField = null;
      const inputs = document.querySelectorAll('#crud-body input, #crud-body textarea');

      inputs.forEach(input => {
        if (!validateField(input.id, input.value)) {
          isValid = false;
          if (!firstErrorField) firstErrorField = input;
        }
      });

      if (!isValid) {
        if (firstErrorField) firstErrorField.focus();
        showToast('Vui lòng kiểm tra lại thông tin', 'error');
        return;
      }

      const btn = document.getElementById('crud-submit');
      const originalContent = btn.innerHTML;

      // Loading State
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Đang lưu...';
      lucide.createIcons();

      try {
        let payload = {};
        let endpoint = `/${currentModule === 'customers' ? 'users' : currentModule}`;
        let method = currentEditId ? 'PUT' : 'POST';
        if (currentEditId) endpoint += `/${currentEditId}`;

        if (currentModule === 'users' || currentModule === 'customers') {
          payload = { name: document.getElementById('m_name').value, role: document.getElementById('m_role').value };
          if (!currentEditId) {
            payload.email = document.getElementById('m_email').value;
            payload.password = document.getElementById('m_pass').value;
            endpoint = '/auth/register'; method = 'POST';
          }
        } else if (currentModule === 'products') {
          payload = {
            product_code: document.getElementById('m_code').value,
            name: document.getElementById('m_name').value,
            price: parseMoney(document.getElementById('m_price').value),
            stock: document.getElementById('m_stock').value,
            image: document.getElementById('m_image') ? document.getElementById('m_image').value : null
          };
        } else if (currentModule === 'companies') {
          payload = {
            name: document.getElementById('m_name').value,
            email: document.getElementById('m_email').value,
            phone: normalizePhone(document.getElementById('m_phone').value),
            address: document.getElementById('m_addr').value
          };
        }

        const data = await fetchAPI(endpoint, { method, body: JSON.stringify(payload) });

        // Success Feedback & Immediate UI Update
        if (currentEditId) {
          const index = currentData.findIndex(x => x.id === currentEditId);
          if (index !== -1) currentData[index] = data;
          showToast('Cập nhật thành công!');
        } else {
          if (!(currentModule === 'customers' && data.role !== 'CUSTOMER')) {
            currentData.unshift(data);
          }
          showToast('Thêm mới thành công!');
        }

        // Robust UI Update & Close
        renderTableBody(data ? data.id : null);
        closeCrudModal();

        if (!currentEditId) {
          document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
        }

      } catch (err) {
        console.error("Submit error:", err);
        showToast(err.message || 'Có lỗi xảy ra, vui lòng thử lại', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalContent;
        lucide.createIcons();
      }
    };

    window.deleteRecord = async (id, moduleOverride = null) => {
      if (user.role === 'STAFF') { return showToast('Bạn chỉ có quyền xem', 'error'); }
      const targetModule = moduleOverride || currentModule;
      showConfirm(
        'Xác nhận xóa?',
        'Bạn có chắc chắn muốn xóa bản ghi này? Dữ liệu sẽ bị xóa vĩnh viễn khỏi hệ thống.',
        async () => {
          try {
            let endpoint = `/${targetModule === 'customers' ? 'users' : targetModule}/${id}`;
            await fetchAPI(endpoint, { method: 'DELETE' });

            // Immediate UI Update
            currentData = currentData.filter(x => x.id !== id);
            renderTableBody();

            showToast('Đã xóa dữ liệu thành công!');
          } catch (err) {
            showToast(err.message || 'Không thể xóa dữ liệu', 'error');
          }
        }
      );
    };

    window.updateOrderStatus = async (id, status) => {
      if (user.role === 'STAFF') { return showToast('Bạn chỉ có quyền xem', 'error'); }
      try {
        const res = await fetchAPI(`/orders/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
        
        // Cấu trúc API trả về là { message, order }
        const updatedOrderData = res.order || res;

        // Cập nhật UI ngay lập tức
        const index = currentData.findIndex(x => x.id === id);

        <td style="padding:8px"><input type="text" class="i-content" style="margin:0; width:100%; padding:8px; border-radius:8px; background:#ffffff; border:1px solid var(--border); color:var(--text-primary); outline:none; box-shadow:var(--shadow-sm);" value="${content}"></td>

        <td style="padding:8px"><input type="text" class="i-price" style="margin:0; width:100%; padding:8px; border-radius:8px; background:#ffffff; border:1px solid var(--border); color:var(--text-primary); outline:none; text-align:right; box-shadow:var(--shadow-sm);" value="${formatMoney(price)}" oninput="formatInputMoney(this); calcRow(this)"></td>

        <td style="padding:8px; text-align:center"><button type="button" class="btn-icon-header" style="color:var(--danger); margin:0 auto;" onclick="this.closest('tr').remove(); calcTotal()"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button></td>

    window.formatInputMoney = (input) => { let v = input.value.replace(/[^0-9]/g, ''); input.value = v ? parseFloat(v).toLocaleString('vi-VN') : ''; };
    window.calcRow = (el) => { const tr = el.closest('tr'); const qty = parseFloat(tr.querySelector('.i-qty').value) || 0; const price = parseMoney(tr.querySelector('.i-price').value); tr.querySelector('.i-total').value = formatMoney(qty * price); calcTotal(); };
    window.calcTotal = () => { let sum = 0; document.querySelectorAll('.i-total').forEach(i => sum += parseMoney(i.value)); const vat = sum * 0.08; const finalTotal = sum + vat; if (document.getElementById('q_subtotal_display')) document.getElementById('q_subtotal_display').textContent = formatMoney(sum); if (document.getElementById('q_vat_display')) document.getElementById('q_vat_display').textContent = formatMoney(vat); document.getElementById('q_total_display').textContent = formatMoney(finalTotal); return finalTotal; };

    window.handleExcelImport = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (jsonData.length < 2) return showToast('File Excel không có dữ liệu', 'error');

          // Mapping: STT | Tên sản phẩm | Nội dung | ĐVT | Số lượng | Đơn giá | Thành tiền
          const rows = jsonData.slice(1);
          const tbody = document.getElementById('items-body');
          tbody.innerHTML = '';

          let importCount = 0;
          rows.forEach(row => {
            if (!row[1]) return; // Skip if no product name
            const name = row[1] || '';
            const content = row[2] || '';
            const unit = row[3] || 'Cái';
            const qty = parseFloat(row[4]) || 1;
            const price = parseFloat(row[5]) || 0;
            addBlankRow(name, content, unit, qty, price);
            importCount++;
          });

          calcTotal();
          showToast(`Đã import ${importCount} sản phẩm thành công!`);
          e.target.value = ''; // Reset input
        } catch (err) {
          showToast('Lỗi đọc file Excel. Vui lòng kiểm tra định dạng.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    };

    window.saveQuote = async () => {
      if (user.role === 'STAFF') { return showToast('Bạn chỉ có quyền xem', 'error'); }
      const btn = document.querySelector('button[onclick="saveQuote()"]');
      const originalContent = btn.innerHTML;

      const customer = document.getElementById('q_customer').value.trim();
      if (!customer) return showToast('Vui lòng nhập Khách hàng', 'error');

      const items = [];
      document.querySelectorAll('#items-body tr').forEach(tr => {
        const name = tr.querySelector('.i-name').value.trim();
        if (name) items.push({
          name,
          content: tr.querySelector('.i-content').value.trim(),
          unit: tr.querySelector('.i-unit').value.trim(),
          qty: parseFloat(tr.querySelector('.i-qty').value) || 0,
          price: parseMoney(tr.querySelector('.i-price').value),
          total: parseMoney(tr.querySelector('.i-total').value),
          image: tr.querySelector('.i-image') ? tr.querySelector('.i-image').value : ''
        });
      });
      if (!items.length) return showToast('Cần ít nhất 1 sản phẩm', 'error');

      // Loading state
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Đang lưu...';
      lucide.createIcons();

      try {
        const totalAmount = calcTotal();
        const existingQuote = quotes.find(q => q.id === window.currentQuoteIdTemp);
        const quoteData = {
          id: window.currentQuoteIdTemp,
          orderId: existingQuote ? existingQuote.orderId : null,
          customer,
          receiver: document.getElementById('q_receiver').value.trim(),
          address: document.getElementById('q_address').value.trim(),
          phone: document.getElementById('q_phone').value.trim(),
          email: document.getElementById('q_email').value.trim(),
          date: document.getElementById('q_date').value,
          terms: document.getElementById('q_terms').value,
          items,
          totalAmount
        };

        // Sync to Orders module
        const newOrderId = await syncToOrder(quoteData);
        if (newOrderId) quoteData.orderId = newOrderId;

        const idx = quotes.findIndex(q => q.id === window.currentQuoteIdTemp);
        if (idx >= 0) quotes[idx] = quoteData; else quotes.unshift(quoteData);
        localStorage.setItem('crm_quotes', JSON.stringify(quotes));

        showToast('Đã lưu Báo giá và đồng bộ sang Đơn hàng!');
        loadView('quotation');
      } catch (err) {
        showToast('Lỗi khi lưu hoặc đồng bộ báo giá', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalContent;
        lucide.createIcons();
      }
    };

    async function syncToOrder(quoteData) {
      try {
        // Tìm và xóa các đơn hàng cũ có cùng mã (order_code = quoteData.id)
        // Điều này đảm bảo không bao giờ bị trùng lặp đơn hàng cho cùng một báo giá
        const allOrders = await fetchAPI('/orders');
        const oldOrders = allOrders.filter(o => o.order_code === quoteData.id);
        
        for (const old of oldOrders) {
          try {
            await fetchAPI(`/orders/${old.id}`, { method: 'DELETE' });
          } catch (e) { console.warn('Lỗi khi xóa đơn cũ:', e); }
        }

        const orderPayload = {
          order_code: quoteData.id, // Dùng mã báo giá làm mã đơn hàng để dễ quản lý
          total_price: quoteData.totalAmount,
          items: [],
          status: 'pending'
        };

        // Tìm customer_id
        const allUsers = await fetchAPI('/users');
        const match = allUsers.find(u => u.name.toLowerCase() === quoteData.customer.toLowerCase());
        if (match) orderPayload.customer_id = match.id;

        // Tìm product_id cho từng item (dựa vào tên)
        const allProducts = await fetchAPI('/products');
        orderPayload.items = quoteData.items.map(i => {
          const pMatch = allProducts.find(p => p.name.toLowerCase() === i.name.toLowerCase());
          return {
            product_id: pMatch ? pMatch.id : 1,
            quantity: i.qty,
            price: i.price
          };
        });

        const res = await fetchAPI('/orders/admin-create', {
          method: 'POST',
          body: JSON.stringify(orderPayload)
        });
        
        return res.order ? res.order.id : null;
      } catch (err) {
        console.error('Order sync failed:', err);
        return null;
      }
    }

            <div class="form-group">
              <label>Số điện thoại *</label>
              <input type="text" id="p_phone" value="${profileData.phone || ''}" onblur="validateField('p_phone', this.value)">
              <span class="error-msg"></span>
            </div>
            <div class="form-group">
              <label>Địa chỉ *</label>
              <input type="text" id="p_address" value="${profileData.address || ''}" onblur="validateField('p_address', this.value)">
              <span class="error-msg"></span>
            </div>
            
            <div style="margin-top:32px; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid var(--border); padding-top:24px;">
               <button type="button" class="btn btn-ghost" onclick="loadView('dashboard')">Hủy bỏ</button>
               <button type="submit" class="btn btn-primary" id="btn-save-profile"><i data-lucide="save"></i> Lưu cập nhật</button>
            </div>
          </form>
        </div>
      `;
    }

    window.previewAvatar = (url, name) => {
      const img = document.getElementById('p_preview_avatar');
      const letter = document.getElementById('p_preview_letter');
      if (url) {
        img.src = url; img.style.display = 'block'; letter.style.display = 'none';
      } else {
        img.style.display = 'none'; letter.style.display = 'flex'; letter.textContent = name.charAt(0).toUpperCase();
      }
    };

    window.handleFileUpload = (e, name) => {
      const file = e.target.files[0];
      if (!file) return;

      // Simple validation for size (max 2MB)
      if (file.size > 2 * 1024 * 1024) return showToast('Ảnh quá lớn, vui lòng chọn ảnh < 2MB', 'error');

      const reader = new FileReader();
      reader.onload = (ev) => {
        const base64 = ev.target.result;
        document.getElementById('p_avatar_input').value = base64;
        previewAvatar(base64, name);
      };
      reader.readAsDataURL(file);
    };

    window.saveProfile = async (e) => {
      e.preventDefault();

      // Validation
      let isValid = true;
      ['p_name', 'p_phone', 'p_address'].forEach(id => {
        if (!validateField(id, document.getElementById(id).value)) isValid = false;
      });

      if (!isValid) return showToast('Vui lòng kiểm tra lại thông tin', 'error');

      const btn = document.getElementById('btn-save-profile');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Đang lưu...';
      btn.disabled = true;
      lucide.createIcons();

      try {
        const payload = {
          name: document.getElementById('p_name').value,
          phone: normalizePhone(document.getElementById('p_phone').value),
          address: document.getElementById('p_address').value,
          avatar: document.getElementById('p_avatar_input').value
        };

        const updatedUser = await fetchAPI('/users/profile', { method: 'PUT', body: JSON.stringify(payload) });

        const sessionUser = JSON.parse(localStorage.getItem('crm_user'));
        const newUser = { ...sessionUser, ...updatedUser };
        localStorage.setItem('crm_user', JSON.stringify(newUser));

        document.getElementById('header-user-name').textContent = newUser.name;
        const ava = document.getElementById('header-avatar');
        if (newUser.avatar) {
          ava.innerHTML = `<img src="${newUser.avatar}">`;
        } else {
          ava.innerHTML = newUser.name.charAt(0).toUpperCase();
        }

        showToast('Cập nhật Profile thành công!');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
      }
    };

    // ==========================================
    // GLOBAL SEARCH SYSTEM
    // ==========================================
    let globalSearchData = { users: [], companies: [], products: [], quotes: [], orders: [] };
    let isSearchDataLoaded = false;
    let searchDebounceTimer = null;
    let currentSearchIndex = -1;

    const loadGlobalSearchData = async () => {
      if (isSearchDataLoaded) return;
      try {
        const [uRes, cRes, pRes, oRes] = await Promise.all([
          fetchAPI('/users').catch(() => []),
          fetchAPI('/companies').catch(() => []),
          fetchAPI('/products').catch(() => []),
          fetchAPI('/orders').catch(() => [])
        ]);
        globalSearchData.users = uRes.filter(u => u.role === 'CUSTOMER');
        globalSearchData.companies = cRes;
        globalSearchData.products = pRes;
        globalSearchData.orders = oRes;
        isSearchDataLoaded = true;
      } catch (e) {
        console.error("Lỗi tải dữ liệu search:", e);
      }
    };

    const highlightText = (text, query) => {
      if (!query || !text) return text || '';
      const regex = new RegExp(`(${query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
      return text.toString().replace(regex, '<span class="search-highlight">$1</span>');
    };

    const renderRecentSearches = () => {
      const recent = JSON.parse(localStorage.getItem('crm_recent_searches') || '[]');
      if (recent.length === 0) {
        return `
          <div class="search-empty">
            <i data-lucide="search" style="margin: 0 auto 12px; width:32px; height:32px; color:var(--text-secondary);"></i>
            <div class="search-empty-text">Nhập từ khóa để tìm kiếm...</div>
          </div>
        `;
      }
      return `
        <div class="search-section">
          <div class="search-section-title"><i data-lucide="history" style="width:14px;height:14px"></i> Lịch sử tìm kiếm</div>
          ${recent.map((r) => `
            <button type="button" class="search-item" onclick="document.getElementById('global-search-input').value='${r}'; handleGlobalSearch('${r}')">
              <div class="search-item-icon" style="background:transparent; color:var(--text-secondary)"><i data-lucide="clock"></i></div>
              <div class="search-item-content">
                <div class="search-item-title" style="font-weight:500;">${r}</div>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    };

    window.handleGlobalSearch = async (query) => {
      const dropdown = document.getElementById('global-search-dropdown');
      query = query.trim().toLowerCase();
      
      if (!query) {
        dropdown.innerHTML = renderRecentSearches();
        if(window.lucide) lucide.createIcons();
        dropdown.classList.add('show');
        currentSearchIndex = -1;
        return;
      }

      if (!isSearchDataLoaded) {
        dropdown.innerHTML = '<div class="search-empty"><i data-lucide="loader-2" class="spin" style="margin: 0 auto 12px; width:32px; height:32px; color:var(--accent);"></i><div class="search-empty-text">Đang tải dữ liệu...</div></div>';
        if(window.lucide) lucide.createIcons();
        dropdown.classList.add('show');
        await loadGlobalSearchData();
      }

      globalSearchData.quotes = JSON.parse(localStorage.getItem('crm_quotes') || '[]');

      const results = { customers: [], companies: [], products: [], quotes: [] };
      const isMatch = (str, q) => str && str.toString().toLowerCase().includes(q);

      globalSearchData.users.forEach(u => {
        if (isMatch(u.name, query) || isMatch(u.email, query) || isMatch(u.phone, query)) {
          results.customers.push({ type: 'customers', id: u.id, name: u.name, desc: u.email || u.phone || 'Khách hàng', icon: 'user' });
        }
      });

      globalSearchData.companies.forEach(c => {
        if (isMatch(c.name, query) || isMatch(c.email, query) || isMatch(c.phone, query)) {
          results.companies.push({ type: 'companies', id: c.id, name: c.name, desc: c.email || c.phone || 'Công ty', icon: 'building-2' });
        }
      });

      globalSearchData.products.forEach(p => {
        if (isMatch(p.name, query) || isMatch(p.product_code, query)) {
          results.products.push({ type: 'products', id: p.id, name: p.name, desc: `${p.product_code} • ${formatMoney(p.price)} đ`, icon: 'package' });
        }
      });

      globalSearchData.quotes.forEach(q => {
        if (isMatch(q.id, query) || isMatch(q.customer, query)) {
          results.quotes.push({ type: 'quotes', id: q.id, name: `Báo giá ${q.id}`, desc: `KH: ${q.customer} • ${formatMoney(q.totalAmount)} đ`, icon: 'file-text' });
        }
      });

      const totalResults = results.customers.length + results.companies.length + results.products.length + results.quotes.length;
      
      if (totalResults === 0) {
        dropdown.innerHTML = `
          <div class="search-empty">
            <i data-lucide="inbox" style="margin: 0 auto 12px; width:32px; height:32px; color:var(--text-secondary);"></i>
            <div class="search-empty-text">Không tìm thấy kết quả cho "${query}"</div>
          </div>
        `;
        if(window.lucide) lucide.createIcons();
        currentSearchIndex = -1;
        return;
      }

      let html = '';
      const buildSection = (title, items) => {
        if (items.length === 0) return '';
        return `
          <div class="search-section">
            <div class="search-section-title">${title}</div>
            ${items.slice(0, 5).map(item => `
              <button type="button" class="search-item" onclick="executeSearchResult('${item.type}', '${item.id}', '${query}')">
                <div class="search-item-icon"><i data-lucide="${item.icon}"></i></div>
                <div class="search-item-content">
                  <div class="search-item-title">${highlightText(item.name, query)}</div>
                  <div class="search-item-desc">${highlightText(item.desc, query)}</div>
                </div>
              </button>
            `).join('')}
          </div>
        `;
      };

      html += buildSection('Sản phẩm', results.products);
      html += buildSection('Báo giá', results.quotes);
      html += buildSection('Khách hàng', results.customers);
      html += buildSection('Công ty', results.companies);

      dropdown.innerHTML = html;
      if(window.lucide) lucide.createIcons();
      currentSearchIndex = -1;
    };

    window.executeSearchResult = (type, id, query) => {
      if (query) {
        let recent = JSON.parse(localStorage.getItem('crm_recent_searches') || '[]');
        recent = [query, ...recent.filter(r => r !== query)].slice(0, 5);
        localStorage.setItem('crm_recent_searches', JSON.stringify(recent));
      }

      const dropdown = document.getElementById('global-search-dropdown');
      const container = document.getElementById('global-search-container');
      const overlay = document.getElementById('global-search-overlay');
      
      dropdown.classList.remove('show');
      container.classList.remove('focused');
      overlay.classList.remove('show');
      
      if (type === 'products' || type === 'customers' || type === 'companies') {
        loadView(type).then(() => { setTimeout(() => openCrudModal(parseInt(id)), 300); });
      } else if (type === 'quotes') {
        loadView('quotation_form', id);
      }
    };

    const setupGlobalSearch = () => {
      const input = document.getElementById('global-search-input');
      const dropdown = document.getElementById('global-search-dropdown');
      const container = document.getElementById('global-search-container');
      const overlay = document.getElementById('global-search-overlay');
      if(!input) return;

      const closeSearch = () => {
        dropdown.classList.remove('show');
        container.classList.remove('focused');
        overlay.classList.remove('show');
        input.blur();
      };

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          input.focus();
        }
      });

      input.addEventListener('focus', () => { 
        container.classList.add('focused');
        overlay.classList.add('show');
        handleGlobalSearch(input.value); 
      });
      
      input.addEventListener('click', () => {
         if(!dropdown.classList.contains('show')) {
            container.classList.add('focused');
            overlay.classList.add('show');
            handleGlobalSearch(input.value);
         }
      });

      input.addEventListener('input', (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => { handleGlobalSearch(e.target.value); }, 300);
      });

      input.addEventListener('keydown', (e) => {
        const items = dropdown.querySelectorAll('.search-item');
        if (!dropdown.classList.contains('show') || items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          currentSearchIndex = (currentSearchIndex + 1) % items.length;
          updateSearchSelection(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          currentSearchIndex = (currentSearchIndex - 1 + items.length) % items.length;
          updateSearchSelection(items);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (currentSearchIndex >= 0 && currentSearchIndex < items.length) {
            items[currentSearchIndex].click();
          } else if (items.length > 0 && input.value.trim() !== '') {
            items[0].click();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
        }
      });

      const updateSearchSelection = (items) => {
        items.forEach((item, idx) => {
          if (idx === currentSearchIndex) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          } else {
            item.classList.remove('active');
          }
        });
      };

      document.addEventListener('click', (e) => {
        if (container && !container.contains(e.target)) {
          closeSearch();
        }
      });
      
      overlay.addEventListener('click', closeSearch);
    };

    setTimeout(setupGlobalSearch, 500);

    // ==========================================
    // INITIALIZE ROUTER
    // ==========================================
    const initRouter = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pathParam = urlParams.get('path');
      let currentPath = pathParam || window.location.pathname;
      let paramId = urlParams.get('id');

      if (pathParam) {
        // Clean up the URL if we came from index.html fallback
        const cleanUrl = currentPath + (paramId ? `?id=${paramId}` : '');
        window.history.replaceState({ view: currentPath.replace('/', ''), param: paramId }, "", cleanUrl);
      }

      let initialView = 'dashboard';
      if (currentPath.includes('/orders')) initialView = 'orders';
      else if (currentPath.includes('/products')) initialView = 'products';
      else if (currentPath.includes('/users')) initialView = 'users';
      else if (currentPath.includes('/customers')) initialView = 'customers';
      else if (currentPath.includes('/companies')) initialView = 'companies';
      else if (currentPath.includes('/quotation_form')) initialView = 'quotation_form';
      else if (currentPath.includes('/quotation') || currentPath.includes('/quotations')) initialView = 'quotation';
      else if (currentPath.includes('/profile')) initialView = 'profile';

      loadView(initialView, paramId, true);
    };

    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view) {
        loadView(e.state.view, e.state.param, true);
      } else {
        initRouter();
      }
    });

    initRouter();
  </script>
</body>

</html>
