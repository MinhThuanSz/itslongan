<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cửa Hàng - CRM Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-color: var(--primary); }
    .product-icon { width: 100%; height: 160px; background: rgba(99,102,241,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 16px; }
    .product-code { font-size: 11px; color: var(--primary-light); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    .product-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .product-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; flex: 1; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; }
    .product-price { font-size: 18px; font-weight: 800; color: var(--success); }
    
    .cart-drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; background: var(--card); border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.5); transform: translateX(100%); transition: transform 0.3s; z-index: 200; display: flex; flex-direction: column; }
    .cart-drawer.open { transform: translateX(0); }
    .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .cart-title { font-size: 18px; font-weight: 700; }
    .cart-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .cart-body { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: rgba(15,15,26,0.9); }
    .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    
    .cart-item { display: flex; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
    .cart-item-icon { width: 60px; height: 60px; background: rgba(99,102,241,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .cart-item-price { font-size: 13px; color: var(--success); margin-bottom: 8px; }
    .cart-qty { display: flex; align-items: center; gap: 8px; }
    .cart-qty button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--card2); color: var(--text); cursor: pointer; }
    .cart-qty input { width: 40px; text-align: center; background: transparent; border: none; color: var(--text); font-size: 13px; }
    .cart-item-del { background: none; border: none; color: var(--danger); cursor: pointer; margin-left: auto; padding: 4px; }
  </style>
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">⚡</div>
      <div class="sidebar-logo-text">CRM Pro</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Khách hàng</div>
      <button class="nav-item active" onclick="loadView('store')">
        <span class="nav-icon">🛍️</span> <span>Cửa hàng</span>
      </button>
      <button class="nav-item" onclick="loadView('orders')">
        <span class="nav-icon">🧾</span> <span>Đơn hàng của tôi</span>
      </button>
      <button class="nav-item" onclick="loadView('profile')">
        <span class="nav-icon">👤</span> <span>Hồ sơ</span>
      </button>
    </nav>
    <div class="sidebar-user">
      <div class="user-card">
        <div id="user-avatar" class="user-avatar">?</div>
        <div>
          <div id="user-name" class="user-name">User</div>
          <div id="user-role" class="user-role">Role</div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Đăng xuất">🚪</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <div id="topbar-title" class="topbar-title">Cửa hàng Sản phẩm</div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="toggleCart()">
          🛒 Giỏ hàng <span id="cart-count" class="badge" style="background:rgba(0,0,0,0.2);margin-left:6px">0</span>
        </button>
      </div>
    </header>
    <div class="content" id="main-content">
      <!-- Content loaded here -->
    </div>
  </main>

  <!-- Cart Drawer -->
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3 class="cart-title">Giỏ hàng</h3>
      <button class="cart-close" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-body" id="cart-items">
      <div style="text-align:center;color:var(--text-muted);margin-top:20px">Giỏ hàng trống</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Tổng cộng:</span>
        <span id="cart-total-price">0 đ</span>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;font-size:16px" onclick="checkout()">Thanh toán ngay</button>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000';
    
    // Auth Check
    const token = localStorage.getItem('crm_token');
    const user = JSON.parse(localStorage.getItem('crm_user') || 'null');
    
    if (!token || !user) {
      window.location.href = 'login.html';
    } else if (user.role !== 'CUSTOMER') {
      window.location.href = 'dashboard.html';
    }

    // Init UI
    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-role').textContent = 'Khách hàng';
    if(user.avatar) {
      document.getElementById('user-avatar').innerHTML = `<img src="${user.avatar}" alt="avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
    } else {
      document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
    }

    // Helper functions
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.className = 'toast', 3000);
    }

    function logout() {
      localStorage.removeItem('crm_token');
      localStorage.removeItem('crm_user');
      window.location.href = 'login.html';
    }

    function formatMoney(amount) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    async function fetchAPI(endpoint, options = {}) {
      const res = await fetch(`${API}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
      if (!res.ok) {
        if(res.status === 401 || res.status === 403) logout();
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Lỗi kết nối API');
      }
      return res.json();
    }

    // View Routing
    function updateNav(view) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`[onclick="loadView('${view}')"]`).classList.add('active');
    }

    async function loadView(view) {
      updateNav(view);
      const content = document.getElementById('main-content');
      const title = document.getElementById('topbar-title');
      content.innerHTML = '<div class="loading"><div class="spinner"></div> Đang tải dữ liệu...</div>';

      try {
        if (view === 'store') {
          title.textContent = 'Cửa hàng Sản phẩm';
          await renderStore(content);
        } else if (view === 'orders') {
          title.textContent = 'Đơn hàng của tôi';
          await renderOrders(content);
        } else if (view === 'profile') {
          title.textContent = 'Hồ sơ Cá nhân';
          await renderProfile(content);
        }
      } catch (err) {
        content.innerHTML = `<div class="alert error">❌ ${err.message}</div>`;
      }
    }

    // Store View
    async function renderStore(container) {
      const products = await fetchAPI('/products');
      let html = '<div class="store-grid">';
      
      products.forEach(p => {
        const icons = ['💻', '📱', '🔧', '🌐', '🚀', '📦'];
        const icon = icons[p.id % icons.length];
        
        html += `
          <div class="product-card">
            <div class="product-icon">${icon}</div>
            <div class="product-code">${p.product_code}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.description || 'Chưa có mô tả'}</div>
            <div class="product-footer">
              <div class="product-price">${formatMoney(p.price)}</div>
              <button class="btn btn-primary btn-sm" onclick="addToCart(${p.id})">+ Thêm vào giỏ</button>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Orders View
    async function renderOrders(container) {
      const orders = await fetchAPI('/orders');
      let rows = orders.map(o => `
        <tr>
          <td><strong>${o.order_code}</strong></td>
          <td>${formatMoney(o.total_price)}</td>
          <td><span class="badge badge-${o.status}">${o.status}</span></td>
          <td>${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
          <td>
             <button class="btn btn-ghost btn-sm" onclick="alert('Xem chi tiết đơn ${o.order_code}')">👁️</button>
          </td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="table-card">
          <div class="table-header">
            <h3 class="card-title">Lịch sử đặt hàng</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Mã đơn</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày đặt</th><th>Chi tiết</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="5" style="text-align:center">Chưa có đơn hàng nào</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Profile View
    async function renderProfile(container) {
      const p = await fetchAPI('/users/profile');
      
      container.innerHTML = `
        <div class="chart-card" style="max-width: 600px">
           <h3 style="margin-bottom: 20px">Thông tin tài khoản</h3>
           <div style="display:grid; grid-template-columns: 100px 1fr; gap: 16px; margin-bottom: 12px">
             <div style="color:var(--text-muted)">Họ tên:</div><div><strong>${p.name}</strong></div>
             <div style="color:var(--text-muted)">Email:</div><div>${p.email}</div>
             <div style="color:var(--text-muted)">SĐT:</div><div>${p.phone || '-'}</div>
             <div style="color:var(--text-muted)">Địa chỉ:</div><div>${p.address || '-'}</div>
             <div style="color:var(--text-muted)">Loại KH:</div><div>${p.customerProfile?.type === 'company_customer' ? 'Khách công ty' : 'Khách lẻ'}</div>
             ${p.customerProfile?.company ? `<div style="color:var(--text-muted)">Công ty:</div><div>${p.customerProfile.company.name}</div>` : ''}
           </div>
        </div>
      `;
    }

    // Cart Logic
    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      if (!drawer.classList.contains('open')) {
        loadCart();
      }
      drawer.classList.toggle('open');
    }

    async function loadCart() {
      try {
        const { items, total } = await fetchAPI('/cart');
        document.getElementById('cart-count').textContent = items.reduce((sum, i) => sum + i.quantity, 0);
        document.getElementById('cart-total-price').textContent = formatMoney(total);
        
        const cartBody = document.getElementById('cart-items');
        if (items.length === 0) {
          cartBody.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:20px">Giỏ hàng trống</div>';
          return;
        }

        cartBody.innerHTML = items.map(i => `
          <div class="cart-item">
            <div class="cart-item-icon">🛍️</div>
            <div class="cart-item-info">
              <div class="cart-item-name">${i.product.name}</div>
              <div class="cart-item-price">${formatMoney(i.product.price)}</div>
              <div class="cart-qty">
                <button onclick="updateCartItem(${i.id}, ${i.quantity - 1})">-</button>
                <input type="text" value="${i.quantity}" readonly />
                <button onclick="updateCartItem(${i.id}, ${i.quantity + 1})">+</button>
                <button class="cart-item-del" onclick="updateCartItem(${i.id}, 0)">🗑️</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    window.addToCart = async (productId) => {
      try {
        await fetchAPI('/cart', {
          method: 'POST',
          body: JSON.stringify({ product_id: productId, quantity: 1 })
        });
        showToast('Đã thêm vào giỏ hàng');
        loadCart(); // Update count
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    window.updateCartItem = async (id, quantity) => {
      try {
        await fetchAPI(`/cart/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ quantity })
        });
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    window.checkout = async () => {
      try {
        await fetchAPI('/orders', { method: 'POST' });
        showToast('🎉 Đặt hàng thành công!');
        toggleCart();
        loadCart();
        if (document.getElementById('topbar-title').textContent === 'Cửa hàng Sản phẩm') {
          // Stay on store
        } else {
          loadView('orders');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Init Page
    loadView('store');
    loadCart();
  </script>
</body>
</html>
