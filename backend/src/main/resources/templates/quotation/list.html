<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
    <div th:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Danh sách Báo giá</h1>
            <a th:href="@{/quotations/create}" class="btn btn-primary">Tạo Báo giá mới</a>
        </div>

        <div class="card">
            <form th:action="@{/quotations}" method="get" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo Số hiệu, Khách hàng hoặc Tiêu đề..." style="flex: 1;">
                <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Số hiệu</th>
                        <th>Ngày tạo</th>
                        <th>Khách hàng</th>
                        <th>Tiêu đề</th>
                        <th>Tổng cộng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="q : ${quotations}">
                        <td th:text="${q.quotationNo}"></td>
                        <td th:text="${#temporals.format(q.createdDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${q.customer != null ? q.customer.name : 'N/A'}"></td>
                        <td th:text="${q.title}"></td>
                        <td th:text="${#numbers.formatDecimal(q.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                        <td>
                            <a th:href="@{'/quotations/view/' + ${q.id}}" class="btn btn-success"><i class="fas fa-eye"></i></a>
                            <a th:href="@{'/quotations/edit/' + ${q.id}}" class="btn btn-primary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{'/quotations/delete/' + ${q.id}}" class="btn btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
