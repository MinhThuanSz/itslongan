<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
    <div th:fragment="content">
        <h1 th:text="${customer.id == null ? 'Thêm Khách hàng mới' : 'Chỉnh sửa Khách hàng'}">Thêm Khách hàng</h1>

        <div class="card">
            <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label>Tên khách hàng / Công ty</label>
                    <input type="text" th:field="*{name}" required placeholder="Nhập tên khách hàng hoặc công ty">
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" th:field="*{address}" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố">
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" th:field="*{phone}" placeholder="Nhập số điện thoại liên lạc">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="example@gmail.com">
                </div>

                <div class="form-group">
                    <label>Người liên hệ</label>
                    <input type="text" th:field="*{contactPerson}" placeholder="Tên người đại diện liên hệ">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                    <a th:href="@{/customers}" class="btn btn-secondary" style="text-decoration: none;">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
